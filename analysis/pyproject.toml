[project]
name = "opusvideo-analysis"
version = "0.1.0"
description = "Audio analysis and lyric alignment for the Call in Opus music video"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy<2.1",
    "scipy",
    "librosa>=0.10.2",
    "soundfile",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs>=4.0.1",
    "faster-whisper>=1.0.3",
    "matplotlib",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
